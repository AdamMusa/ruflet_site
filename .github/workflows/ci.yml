name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-24.04

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The API catalogs in config/ are generated from these exact Ruflet and
      # ruflet-engine commits. When you regenerate them with
      # script/sync_ruflet_api, update both refs to the commits you synced from.
      # The docs tests also read Ruflet's config schema and run the
      # RufletRecord examples against packages/ruflet_record.
      - name: Check out Ruflet source
        uses: actions/checkout@v6
        with:
          repository: AdamMusa/ruflet
          ref: 27e2ffa827bed29a5ea93b988c328c22e1d910bb
          path: .ruflet-sources/ruflet
          sparse-checkout: |
            packages/ruflet_core
            packages/ruflet_server
            packages/ruflet_record
            packages/ruflet/lib/ruflet/cli/build/config_schema

      - name: Check out ruflet-engine source
        uses: actions/checkout@v6
        with:
          repository: AdamMusa/ruflet-engine
          ref: b35622d6269738df50cece70f3fe7f911e5d10bc
          path: .ruflet-sources/ruflet-engine

      # The RufletRecord page documents the published 0.0.23 gem: its
      # unmarked examples also run against this commit, which set
      # ruflet_record's VERSION to 0.0.23.
      - name: Check out RufletRecord 0.0.23 source
        uses: actions/checkout@v6
        with:
          repository: AdamMusa/ruflet
          ref: b34072be854ec713184a4b7772f5e0645d830022
          path: .ruflet-sources/ruflet-record-0.0.23
          sparse-checkout: |
            packages/ruflet_record

      - name: Run tests
        env:
          RAILS_ENV: test
          RUFLET_SOURCE_ROOT: ${{ github.workspace }}/.ruflet-sources/ruflet
          RUFLET_ENGINE_ROOT: ${{ github.workspace }}/.ruflet-sources/ruflet-engine
          RUFLET_RECORD_RELEASE_ROOT: ${{ github.workspace }}/.ruflet-sources/ruflet-record-0.0.23
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-24.04

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The site has no system tests yet; `rails test:system` raises LoadError
      # when test/system does not exist.
      - name: Run System Tests
        if: hashFiles('test/system/**/*_test.rb') != ''
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
